# Build and contract checks for turnbase-common.
#
# IMP-M0-01 requires buf lint and buf breaking to run in CI. IMP-M0-11 (this file's Trivy
# step, and publish.yml alongside it) owns the rest of the pipeline for all five
# repositories — dependency scanning and release on tag.
#
# master everywhere, never main (conventions.md §4).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM CE 21
        # NOT actions/setup-java: it has no graalvm-community distribution and fails with
        # "No supported distribution was found for input graalvm-community". GraalVM CE is
        # set up by GraalVM's own action, and the toolchain is pinned to 21.0.2-graalce in
        # .sdkmanrc, so CI and a developer's shell run the same JDK.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        # Spotless runs at validate, Error Prone and NullAway during compile, JaCoCo's
        # merged check at verify — so this one command is the whole Java gate.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Trivy scan — dependencies
        # One scan per target (IMP-M20-13): every severity lands in one JSON result, which is
        # the report (summary below, artifact) and the gate (next step). platform-operations.md
        # FR-CICD-010: all findings are reported, only a critical one blocks the build.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: "LOW,MEDIUM,HIGH,CRITICAL"
          format: json
          output: trivy-deps.json
          exit-code: "0"

      - name: Trivy report and gate — dependencies
        run: |
          jq -r '[.Results[]? | .Target as $t | .Vulnerabilities[]? | {s: .Severity, t: $t, id: .VulnerabilityID, p: .PkgName, v: .InstalledVersion}]
            | group_by(.s) | map("\(.[0].s): \(length)") | .[]' trivy-deps.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? | select(.Severity=="CRITICAL")
            | "CRITICAL \(.VulnerabilityID) \(.PkgName)@\(.InstalledVersion) (\($t))"' trivy-deps.json
          test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-deps.json)" -eq 0

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # buf breaking resolves the base branch from the local clone, which a shallow
          # checkout does not contain.
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          # A separate job from the Maven build because a contract break is a different
          # failure with a different fix, and picking which one broke out of a single
          # job's log is needless work.
          setup_only: false
          lint: true
          format: false

          # breaking runs on every push to master, against the commit the push replaced,
          # and on a pull request against its base branch — the PR path is kept working
          # for whenever PRs come back.
          #
          # This was PR-only until 2026-09-05, because the commit that first introduced
          # the proto had no baseline: HEAD~1 was a tree with no .proto files and buf
          # reported `Module "path: "."" had no .proto files`, which reads as a broken
          # config rather than as "there is no baseline yet". That window closed the
          # moment the proto landed on master. With PRs suspended (ADR-0012, amended
          # 2026-09-05) a PR-only gate would never fire at all — and a contract check
          # that never runs is worse than none, because it still looks like coverage.
          #
          # The push baseline is the local clone (`fetch-depth: 0` above is what makes
          # HEAD~1 resolvable); on a merge commit HEAD~1 is the first parent, i.e. the
          # previous state of master, which is exactly the comparison wanted.
          breaking: true
          breaking_against: ${{ github.event_name == 'pull_request' && format('https://github.com/{0}.git#branch={1}', github.repository, github.base_ref) || '.git#ref=HEAD~1' }}
          push: false
          archive: false
