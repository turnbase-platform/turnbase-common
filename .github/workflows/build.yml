# Build and contract checks for turnbase-common.
#
# IMP-M0-01 requires buf lint and buf breaking to run in CI. IMP-M0-11 owns the rest of
# the pipeline for all five repositories — publish, container scan, release on tag — and
# extends this file rather than replacing it.
#
# master everywhere, never main (conventions.md §4).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # buf breaking compares against the master ref, which a shallow clone lacks.
          # Without this the job fails with "no .proto files" and reads as a buf bug.
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          # GraalVM CE 21 is the runtime the services use; the toolchain is pinned to
          # 21.0.2-graalce in .sdkmanrc and this is its CI equivalent.
          distribution: graalvm-community
          java-version: '21'
          cache: maven

      - name: Verify
        # Spotless runs at validate, Error Prone and NullAway during compile, JaCoCo's
        # merged check at verify — so this one command is the whole Java gate.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          # The action runs lint and breaking itself; breaking compares a pull request
          # against its base. A separate job from the Maven build because a contract
          # break is a different failure with a different fix, and reading which one
          # broke off a single job's log is needless work.
          setup_only: false
          lint: true
          format: false
          breaking: true
          breaking_against: ${{ github.event_name == 'pull_request' && format('https://github.com/{0}.git#branch={1}', github.repository, github.base_ref) || format('https://github.com/{0}.git#branch=master,ref=HEAD~1', github.repository) }}
          push: false
          archive: false
