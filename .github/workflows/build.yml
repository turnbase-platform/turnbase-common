# Build and contract checks for turnbase-common.
#
# IMP-M0-01 requires buf lint and buf breaking to run in CI. IMP-M0-11 owns the rest of
# the pipeline for all five repositories — publish, container scan, release on tag — and
# extends this file rather than replacing it.
#
# master everywhere, never main (conventions.md §4).
name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up GraalVM CE 21
        # NOT actions/setup-java: it has no graalvm-community distribution and fails with
        # "No supported distribution was found for input graalvm-community". GraalVM CE is
        # set up by GraalVM's own action, and the toolchain is pinned to 21.0.2-graalce in
        # .sdkmanrc, so CI and a developer's shell run the same JDK.
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: '21'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify
        # Spotless runs at validate, Error Prone and NullAway during compile, JaCoCo's
        # merged check at verify — so this one command is the whole Java gate.
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking resolves the base branch from the local clone, which a shallow
          # checkout does not contain.
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          # A separate job from the Maven build because a contract break is a different
          # failure with a different fix, and picking which one broke out of a single
          # job's log is needless work.
          setup_only: false
          lint: true
          format: false

          # breaking runs on pull requests only, against the PR's base branch.
          #
          # On a push it has nothing meaningful to compare against: HEAD~1 is the commit
          # this one replaced, so the check either duplicates the PR run or, on the commit
          # that first introduces the proto, compares against a tree with no .proto files
          # at all and fails with `Module "path: "."" had no .proto files` — which reads
          # as a broken config rather than as "there is no baseline yet". That is exactly
          # how this job failed on its first run.
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}
          push: false
          archive: false
