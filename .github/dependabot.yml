# Supply-chain updates, per conventions.md §6 and platform-operations.md FR-CICD-010.
#
# FROZEN 2026-09-05. Every ecosystem below carries `open-pull-requests-limit: 0` — GitHub's
# documented switch for turning version updates off without deleting the configuration that
# describes them. Dependabot opened PRs faster than a solo project merges them, and the
# resulting backlog of open PRs and orphaned branches cost more attention than the bumps were
# worth this early. The groups and every `ignore` entry are kept deliberately: each records
# *why* a pin is a decision rather than neglect, and that reasoning outlives the freeze.
# Re-enabling is restoring the limits, nothing else.
#
# Trivy scanning is wired by IMP-M0-11 with the rest of the shared pipeline; this file is
# the half that is pure configuration and therefore cheaper to land now than to remember
# later.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # protobuf-maven-plugin 5.x rewrote its configuration surface: protocVersion and
      # binaryMavenPlugins became protoc and plugins, with different types, so a version
      # bump alone fails with a null-pointer inside mojo configuration parsing. 4.1.3 is
      # a deliberate pin, not a stale one. Moving to 5.x is a config rewrite and belongs
      # in a change that someone intends, so Dependabot is told to stop proposing it.
      - dependency-name: io.github.ascopes:protobuf-maven-plugin
        versions: ['>=5.0.0']
    groups:
      # grpc and protobuf move together and their versions are coupled — protoc, the
      # runtime and the codegen plugin must agree. Separate PRs for each would mean
      # merging a combination nobody built.
      grpc-protobuf:
        patterns:
          - io.grpc:*
          - com.google.protobuf:*
      build-tooling:
        patterns:
          - com.diffplug.spotless:*
          - com.google.errorprone:*
          - com.uber.nullaway:*
          - org.jacoco:*
          - org.apache.maven.plugins:*
          - io.github.ascopes:*
      test:
        patterns:
          - org.junit*
          - org.assertj:*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: chore
      include: scope
